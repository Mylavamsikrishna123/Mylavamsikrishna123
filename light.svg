      <circle class="dot" cx="110" cy="180" r="1.5" style="animation-delay:0.2s"/>
      <circle class="dot" cx="115" cy="180" r="1.5" style="animation-delay:0.25s"/>
      <circle class="dot" cx="100" cy="185" r="1.5" style="animation-delay:0.12s"/>
