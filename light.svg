<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="M VAMSI KRISHNA - AI Infrastructure Engineer">
  <defs>
    <style>
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.3} }
      @keyframes blink { 0%,100% {opacity:1} 50% {opacity:0} }
      @keyframes fadeIn { from {opacity:0} to {opacity:1} }
      .terminal-bg { fill: #F8FAFC; }
      .portrait-frame { fill: none; stroke: #0891B2; stroke-width: 2; rx: 8; }
      .info-panel { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .header { fill: #0891B2; font-size: 13px; font-weight: 600; }
      .row-label { fill: #475569; font-size: 14px; }
      .row-value { fill: #0F172A; font-size: 14px; }
      .live-badge { fill: #EF4444; font-size: 12px; font-weight: 700; animation: pulse 1.5s ease-in-out infinite; }
      .handle-pill { fill: #10B981; font-size: 14px; font-weight: 600; }
      .dot { fill: #7C3AED; }
      .logo-traveller { fill: #0891B2; }
    </style>
  </defs>
  
  <!-- Terminal background (light) -->
